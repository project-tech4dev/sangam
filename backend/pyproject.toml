[project]
name = "sangam-backend"
version = "0.1.0"
description = "SANGAM grant-intelligence agent: FastAPI + LangGraph deep agent over Postgres, exposed via AG-UI for CopilotKit"
requires-python = ">=3.11"
dependencies = [
    "copilotkit>=0.1.96",
    "ag-ui-langgraph>=0.0.45",
    "deepagents>=0.7,<0.8",
    "langchain>=1.2",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=3.0",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-tavily>=0.2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.1",
    "graphiti-core[anthropic]>=0.30,<0.31",
    "langfuse>=3,<4",
    "psycopg[binary,pool]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "pydantic[email]>=2.9",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "pypdf>=5.0",
    "sqlglot>=25,<28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: needs the compose Postgres on localhost:5433"]

[tool.ruff]
line-length = 110
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
