[project]
name = "sangam-backend"
version = "0.1.0"
description = "SANGAM grant-intelligence agent: FastAPI + LangGraph deep agent over Postgres, exposed via AG-UI for CopilotKit"
requires-python = ">=3.11"
dependencies = [
    "copilotkit>=0.1.96",
    "ag-ui-langgraph>=0.0.45",
    "deepagents>=0.7,<0.8",
    "langchain>=1.2",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=3.0",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-tavily>=0.2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.1",
    "graphiti-core[anthropic]>=0.30,<0.31",
    "langfuse>=4.17,<5",
    "psycopg[binary,pool]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "pydantic[email]>=2.9",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "pypdf>=5",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "sqlglot>=25,<28",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff==0.16.8",
    "pytest-cov>=6",
    "diff-cover>=9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: needs the compose Postgres on localhost:5433",
    "eval: calls a real model and costs money; needs --run-evals and the compose Postgres",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's Depends() idiom. RUF012: class-level constants. UP046: PEP 695 needs 3.12, requires-python is 3.11.
ignore = ["B008", "RUF012", "UP046"]

[tool.coverage.run]
source = ["app"]
branch = true
relative_files = true

[tool.coverage.report]
# A ratchet: raise it when coverage grows, never lower it.
fail_under = 60
skip_covered = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
