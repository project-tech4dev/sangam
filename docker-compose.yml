services:
  # Bundled Postgres — only started when the "localdb" profile is active
  # (COMPOSE_PROFILES=localdb, which .env.example ships by default).
  # Point DATABASE_URL at a managed instance and drop the profile to skip it.
  postgres:
    profiles: ["localdb"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-sangam}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-${POSTGRES_PASSWORD:-sangam}}
      POSTGRES_DB: ${LOCAL_DB_NAME:-sangam}
    ports:
      - "5433:5432"   # host 5433: 5432 is taken by dalgo-postgres on this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ so compose passes the literal $ through to the container's shell.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Knowledge graph (Graphiti writes here; agent's search_graph reads it).
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/sangamneo4j
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      # Built from the LOCAL_DB_* parts in .env; LOCAL_DATABASE_URL overrides them.
      # Keyword/value form rather than a URL on purpose: psycopg, psql and
      # pg_restore all accept it, and a password containing @ : / ? # needs no
      # percent-encoding. POSTGRES_PASSWORD is still honoured so .env files
      # written before this split keep working.
      # `make <target> ENV=staging` layers docker-compose.staging.yml over this
      # to point the same tooling at the managed database.
      DATABASE_URL: ${LOCAL_DATABASE_URL:-host=${LOCAL_DB_HOST:-postgres} port=${LOCAL_DB_PORT:-5432} user=${LOCAL_DB_USER:-sangam} password=${LOCAL_DB_PASSWORD:-${POSTGRES_PASSWORD:-sangam}} dbname=${LOCAL_DB_NAME:-sangam} sslmode=${LOCAL_DB_SSLMODE:-prefer}}
      MODEL: ${MODEL:-anthropic:claude-sonnet-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Post-answer audit of SQL answers; empty = off. See docs/SQL_AGENT.md.
      SQL_AUDIT_MODEL: ${SQL_AUDIT_MODEL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-local}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-}
      # Keeps warehouse rows out of traces; the SQL and row counts still show.
      LANGFUSE_MASK_TOOL_RESULTS: ${LANGFUSE_MASK_TOOL_RESULTS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ALLOWED_ORIGIN_REGEX: ${ALLOWED_ORIGIN_REGEX:-}
      # Graph data is embedded at 768 dims — all ingestion/search must match.
      EMBEDDING_DIM: "768"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: sangamneo4j
    ports:
      - "8010:8000"   # host 8010: 8000 is taken by airbyte-proxy on this machine
    depends_on:
      postgres:
        condition: service_healthy
        # required:false so the backend still boots when the bundled Postgres
        # is switched off in favour of a managed one.
        required: false
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend/app:/srv/app
      - ./seed:/srv/seed:ro
      - ./db:/srv/db:ro          # migration runner reads db/migrations from here
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      AGENT_URL: http://backend:8000/agent
      NEXT_PUBLIC_API_URL: http://localhost:8010
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  pgdata:
  neo4jdata:
  frontend_node_modules:
  frontend_next:
