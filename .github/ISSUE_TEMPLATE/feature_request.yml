name: Feature request
description: Suggest something Sangam should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who is stuck, and on what? For example, "A CSO fundraiser can't tell which funders accept proposals this quarter."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
