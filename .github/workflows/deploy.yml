# The only thing that deploys to Vercel. The Git integration is off
# (frontend/vercel.json, backend/vercel.json), so a branch push deploys nothing.
name: Deploy

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # queue; never cancel a production deploy mid-flight

env:
  # Identifiers, not credentials — these are the values `vercel link` writes to
  # .vercel/project.json. Only VERCEL_TOKEN is a secret.
  VERCEL_ORG_ID: team_2wBuhP7bLwZbGSDrsoxh2WdE

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # workflow_dispatch has no `before`, and a first push or force push
          # reports all zeros. Neither gives a usable base, so deploy both.
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no usable base ref; deploying both projects"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for dir in frontend backend; do
            if git diff --quiet "$BEFORE" "${{ github.sha }}" -- "$dir/"; then
              echo "$dir=false" >> "$GITHUB_OUTPUT"
            else
              echo "$dir=true" >> "$GITHUB_OUTPUT"
            fi
          done
          cat "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sangam-six-beta.vercel.app
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g vercel@latest
      # Deploys from the repo root, matching what the Git integration uploaded;
      # the project's own Root Directory setting still selects frontend/.
      # Vercel builds it — no --prebuilt — so the build env is unchanged.
      - run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_s6gnmRzSdmc9gUksqtxcMnfwOSCK

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sangam-backend-one.vercel.app
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g vercel@latest
      - run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_lXhFOACjENhM6n9RqORsvQ3lGgVT
