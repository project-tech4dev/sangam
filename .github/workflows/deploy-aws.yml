# Phase 2, not in use yet: today the instance deploys itself with deploy/aws/deploy.sh (docs/DEPLOY_AWS.md).
# Before using this, apply the open review points: master only, actions pinned by SHA, packages: read on deploy.
# Domains and hosts live in secrets, not variables: this repo is public, and so are its Actions logs.
name: Deploy (AWS)

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: "Apply db/migrations before restarting"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-aws
  cancel-in-progress: false   # never cancel a production deploy mid-flight

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/sangam-backend:${{ env.TAG }}
            ${{ env.REGISTRY }}/sangam-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/sangam-frontend:${{ env.TAG }}
            ${{ env.REGISTRY }}/sangam-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.AWS_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.AWS_NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.AWS_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: aws-production
    steps:
      - uses: actions/checkout@v4
      - name: Bundle compose, Caddyfile and migrations
        run: |
          tar -czf sangam-deploy.tgz deploy/aws/compose.yaml deploy/aws/caddy db/migrations
      - name: Copy the bundle to the instance
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: sangam-deploy.tgz
          target: /opt/sangam
      - name: Pull, migrate, restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ env.TAG }}
          MIGRATE: ${{ inputs.migrate }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TAG,MIGRATE,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -eu
            cd /opt/sangam
            rm -rf db && tar -xzf sangam-deploy.tgz && rm sangam-deploy.tgz
            cd deploy/aws
            test -f .env || { echo "/opt/sangam/deploy/aws/.env is missing; see docs/DEPLOY_AWS.md"; exit 1; }
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export TAG
            compose="docker compose"
            $compose pull
            if [ "$MIGRATE" = "true" ]; then
              $compose run --rm --no-deps backend python -m app.db.migrate
            fi
            $compose up -d --no-build --remove-orphans
            docker logout ghcr.io
            echo "TAG=$TAG" > deployed.txt
            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' "$($compose ps -q backend)")" = "healthy" ]; then
                echo "backend healthy at $TAG"; docker image prune -f; exit 0
              fi
              sleep 5
            done
            echo "backend did not become healthy"; $compose logs --tail=100 backend; exit 1
